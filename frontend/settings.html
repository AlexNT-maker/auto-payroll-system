<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto payroll app — Ρυθμίσεις</title>
    <link rel="stylesheet" href="./src/common.css">
    <link rel="stylesheet" href="./src/materials.css">
    <link rel="stylesheet" href="./src/settings.css">
    <link rel="stylesheet" href="./src/theme.css">
  </head>
  <body data-theme="navy">

    <!-- Loader -->
    <div id="page-loader" class="page-loader hidden">
      <img src="src/icon/logo.svg" alt="Company logo" class="page-loader-logo">
    </div>

    <div class="app-layout">

      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <img src="src/icon/logo.svg" alt="Logo" class="sidebar-logo">
          <button id="sidebar-close" class="sidebar-close" type="button" aria-label="Κλείσιμο μενού">×</button>
        </div>
        <nav class="sidebar-menu"><!-- auto-injected --></nav>
      </aside>

      <div class="app-body">

        <header class="topbar"><!-- auto-injected --></header>

        <main class="app-main" id="settings-page">

          <div class="settings-tabs">
            <button class="settings-tab active" type="button" onclick="showSettingsTab('suppliers', this)">
              Προμηθευτές
            </button>
            <button class="settings-tab" type="button" onclick="showSettingsTab('invoice-categories', this)">
              Κατηγορίες Τιμολογίων
            </button>
            <button class="settings-tab" type="button" onclick="showSettingsTab('material-units', this)">
              Μονάδες Μέτρησης
            </button>
            <button class="settings-tab" type="button" onclick="showSettingsTab('material-categories', this)">
              Κατηγορίες Υλικών
            </button>
          </div>

          <div id="tab-suppliers" class="settings-panel">
            <table class="materials-table">
              <thead>
                <tr>
                  <th>Όνομα</th>
                  <th>ΑΦΜ</th>
                  <th>Τηλέφωνο</th>
                  <th>Email</th>
                  <th>Σημειώσεις</th>
                  <th>Ενέργειες</th>
                </tr>
              </thead>
              <tbody id="suppliers-list"></tbody>
            </table>

            <div class="materials-footer">
              <button class="materials-primary-btn">+ Προσθήκη Προμηθευτή</button>
            </div>
          </div>

          <div id="tab-invoice-categories" class="settings-panel hidden">
            <table class="materials-table">
              <thead>
                <tr>
                  <th>Όνομα</th>
                  <th>Ενέργειες</th>
                </tr>
              </thead>
              <tbody id="invoice-categories-list"></tbody>
            </table>

            <div class="materials-footer">
              <button class="materials-primary-btn">+ Προσθήκη Κατηγορίας</button>
            </div>
          </div>

          <div id="tab-material-units" class="settings-panel hidden">
            <table class="materials-table">
              <thead>
                <tr>
                  <th>Όνομα</th>
                  <th>Ενέργειες</th>
                </tr>
              </thead>
              <tbody id="material-units-list"></tbody>
            </table>

            <div class="materials-footer">
              <button class="materials-primary-btn">+ Προσθήκη Μονάδας</button>
            </div>
          </div>

          <div id="tab-material-categories" class="settings-panel hidden">
            <table class="materials-table">
              <thead>
                <tr>
                  <th>Όνομα</th>
                  <th>Ενέργειες</th>
                </tr>
              </thead>
              <tbody id="material-categories-list"></tbody>
            </table>

            <div class="materials-footer">
              <button class="materials-primary-btn">+ Προσθήκη Κατηγορίας</button>
            </div>
          </div>

          <!-- Modals -->
          <div id="modal-supplier" class="modal hidden">
            <div class="modal-content">
              <h2 id="modal-supplier-title">Νέος Προμηθευτής</h2>

              <form id="supplier-form">
                <input type="hidden" id="supplier-id" />

                <label>Όνομα: *</label>
                <input type="text" id="supplier-name" required />

                <label>ΑΦΜ:</label>
                <input type="text" id="supplier-afm" />

                <label>Τηλέφωνο:</label>
                <input type="text" id="supplier-phone" />

                <label>Email:</label>
                <input type="email" id="supplier-email" />

                <label>Σημειώσεις:</label>
                <textarea id="supplier-notes" rows="3"></textarea>

                <div class="modal-buttons">
                  <button type="submit">Αποθήκευση</button>
                  <button type="button" id="btn-cancel-supplier">Ακύρωση</button>
                </div>
              </form>
            </div>
          </div>

          <div id="modal-named-item" class="modal hidden">
            <div class="modal-content">
              <h2 id="modal-named-item-title">Νέα Εγγραφή</h2>

              <form id="named-item-form">
                <input type="hidden" id="named-item-id" />
                <input type="hidden" id="named-item-type" />

                <label>Όνομα: *</label>
                <input type="text" id="named-item-name" required />

                <div class="modal-buttons">
                  <button type="submit">Αποθήκευση</button>
                  <button type="button" id="btn-cancel-named-item">Ακύρωση</button>
                </div>
              </form>
            </div>
          </div>

          <div id="message-modal" class="modal hidden">
            <div class="message-modal-window">
              <div id="message-modal-icon" class="message-modal-icon"></div>
              <h2 id="message-modal-title">Προσοχή</h2>
              <div id="message-modal-text"></div>
              <div class="message-modal-buttons">
                <button id="message-modal-ok">Επιβεβαίωση</button>
                <button id="message-modal-cancel" class="hidden">Άκυρο</button>
              </div>
            </div>
          </div>

        </main>
      </div>
    </div>

    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
