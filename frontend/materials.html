<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto payroll app</title>
    <link rel="stylesheet" href="./src/common.css">
    <link rel="stylesheet" href="./src/materials.css">
    <link rel="stylesheet" href="./src/theme.css">
  </head>
  <body data-theme="navy">

    <!-- Loader -->
    <div id="page-loader" class="page-loader hidden">
      <img src="src/icon/logo.svg" alt="Company logo" class="page-loader-logo">
    </div>

    <div class="app-layout">

      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <img src="src/icon/logo.svg" alt="Logo" class="sidebar-logo">
          <button id="sidebar-close" class="sidebar-close" type="button" aria-label="Κλείσιμο μενού">×</button>
        </div>
        <nav class="sidebar-menu"><!-- auto-injected --></nav>
      </aside>

      <div class="app-body">

        <header class="topbar"><!-- auto-injected --></header>

        <main class="app-main" id="materials-page">

          <!-- Page 1: Τιμοκατάλογος -->
          <div id="page-price-list" class="materials-page-section">

            <table class="materials-table">
              <thead>
                <tr>
                  <th>Κωδικός</th>
                  <th>Υλικό</th>
                  <th>Κατηγορία</th>
                  <th>Μονάδα</th>
                  <th>Τιμή</th>
                  <th>Ενέργειες</th>
                </tr>
              </thead>
              <tbody id="materials-list"></tbody>
            </table>

            <div class="materials-footer">
              <button id="btn-add-material" class="materials-primary-btn">
                + Προσθήκη Υλικού
              </button>
            </div>
          </div>

          <!-- Page 2: Καταχώρηση -->
          <div id="page-usage" class="materials-page-section hidden">

            <div class="usage-view-toggle">
              <button type="button" data-view="detail" class="active">Λεπτομέρειες</button>
              <button type="button" data-view="aggregate">Σύνοψη</button>
            </div>

            <div class="usage-filters">
              <div class="filter-group">
                <label>Από:</label>
                <input type="date" id="usage-filter-start">
              </div>
              <div class="filter-group">
                <label>Έως:</label>
                <input type="date" id="usage-filter-end">
              </div>
              <div class="filter-group">
                <label>Υλικό:</label>
                <select id="usage-filter-material">
                  <option value="">Όλα</option>
                </select>
              </div>
              <div class="filter-group">
                <label>Κατηγορία:</label>
                <select id="usage-filter-category">
                  <option value="">Όλες</option>
                </select>
              </div>
              <div class="filter-group">
                <label>Παραχωρήθηκε:</label>
                <select id="usage-filter-boat">
                  <option value="">Όλα</option>
                </select>
              </div>
              <button id="usage-filter-clear" type="button" class="usage-filter-clear">
                Καθαρισμός
              </button>
            </div>

            <table class="materials-table" id="usage-table">
              <thead id="usage-thead"></thead>
              <tbody id="usage-list"></tbody>
            </table>
          </div>

          <!-- Page: Τιμολόγια (placeholder) -->
<div id="page-invoices" class="materials-page-section hidden">
  <div class="glass-card" style="padding: 3rem 2rem; text-align: center; margin-top: 2rem;">
    <p style="font-size: 1.1rem; color: #6b7280; margin: 0;">
      🚧 Σε στάδιο ανάπτυξης...
    </p>
    <p style="font-size: 0.9rem; color: #9ca3af; margin-top: 0.75rem;">
      Η καταχώρηση τιμολογίων θα είναι διαθέσιμη σύντομα.
    </p>
  </div>
</div>

          <!-- Page 3: Πλήρες Αναφορά (placeholder) -->
          <div id="page-report" class="materials-page-section hidden">
            <p style="color: #6b7280; text-align: center; margin-top: 2rem;">
              Σε στάδιο ανάπτυξης...
            </p>
          </div>

          <!-- Page: Πλήρες Αναφορά (placeholder) -->
<div id="page-full-report" class="materials-page-section hidden">
  <div class="glass-card" style="padding: 3rem 2rem; text-align: center; margin-top: 2rem;">
    <p style="font-size: 1.1rem; color: #6b7280; margin: 0;">
      🚧 Σε στάδιο ανάπτυξης...
    </p>
  </div>
</div>

          <!-- Modals -->
          <div id="modal-material" class="modal hidden">
            <div class="modal-content">
              <h2 id="modal-material-title">Νέο Υλικό</h2>

              <form id="material-form">
                <input type="hidden" id="material-id" />

                <label>Όνομα Υλικού:</label>
                <input type="text" id="material-name" required />

                <label>Κατηγορία:</label>
                <select id="material-category" required></select>

                <label>Μονάδα:</label>
                <select id="material-unit" required></select>

                <label>Τιμή (€):</label>
                <input type="number" id="material-price" step="0.01" min="0" required />

                <div class="modal-buttons">
                  <button type="submit">Αποθήκευση</button>
                  <button type="button" id="btn-cancel-material">Ακύρωση</button>
                </div>
              </form>
            </div>
          </div>

          <div id="message-modal" class="modal hidden">
            <div class="message-modal-window">
              <div id="message-modal-icon" class="message-modal-icon"></div>
              <h2 id="message-modal-title">Προσοχή</h2>
              <div id="message-modal-text"></div>
              <div class="message-modal-buttons">
                <button id="message-modal-ok">Επιβεβαίωση</button>
                <button id="message-modal-cancel" class="hidden">Άκυρο</button>
              </div>
            </div>
          </div>

        </main>
      </div>
    </div>

    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <script type="module" src="/src/materials.ts"></script>
  </body>
</html>
